name: Nowlun Holding Corp.
description: >-
  Nowlun is a digital freight-forwarding platform serving the Middle East and North
  Africa that lets businesses compare instant ocean-freight quotes from 30+ shipping
  lines, book FCL and bulk sea shipments, arrange inland trucking to and from ports,
  track cargo through transit, and handle customs clearance. Beyond its shipper-facing
  web application, Nowlun operates a live, OAuth-protected Model Context Protocol (MCP)
  server at https://nowlun.com/mcp, secured with RFC 8414 authorization-server and RFC
  9728 protected-resource discovery (Authorization Code + PKCE, "mcp" scope). Surfaced
  as a 500 Global portfolio company and enriched into the API Evangelist network.
